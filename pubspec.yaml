name: viroomall_app
description: "A marketplace application with multiple shopping modes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0
  cached_network_image: ^3.3.1
  image_picker: ^1.2.1
  share_plus: ^7.2.2

  # Navigation
  go_router: ^13.0.1

  # State Management
  flutter_riverpod: ^2.4.9

  # Localization
  flutter_localizations:
    sdk: flutter

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: 9.2.4

  # Network
  dio: ^5.4.0
  connectivity_plus: 6.1.4

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.9
  flutter_local_notifications: ^18.0.0

  # Local Auth
  local_auth: ^2.1.8

  # Utils
  url_launcher: ^6.3.2
  package_info_plus: 9.0.1
  device_info_plus: 11.3.0
  logger: ^2.0.2

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#0D0221"
  adaptive_icon_foreground: "assets/icons/logo.png"

flutter_native_splash:
  color: "#0D0221"
  image: assets/icons/logo.png
  android: true
  ios: true
  web: false