# Uncomment patterns you wish to ignore
# Patterns have two options:
#   - Uncomment the pattern and replace its value with your own
#   - Uncomment the pattern and leave the default value (recommended)
#
# Generated files
ignore_patterns:
  - coverage/**
  - node_modules/**
  - .dart_tool/**
  - build/**
  - .fvm/**

# Docs
# For information on how to write a pub spec file, see https://dart.dev/guides/libraries/pubspec

# The following attributes are parsed by pub and pub tools:

name: viroomall_app
description: 'VirooMall - Comprehensive E-Commerce App with 4 Shopping Modes. Built with Flutter & Riverpod.'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.2.0
  firebase_messaging: ^14.6.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0
  go_router: ^12.0.0
  flutter_dotenv: ^5.1.0
  local_auth: ^2.1.0
  image_picker: ^1.0.0
  image_cropper: ^5.0.0
  flutter_image_compress: ^2.1.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  carousel_slider: ^4.2.0
  smooth_page_indicator: ^1.0.1
  video_player: ^2.7.0
  video_compress: ^3.1.3
  intl: ^0.19.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  get_it: ^7.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
    - assets/svgs/
    - .env

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
